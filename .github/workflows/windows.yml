name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          cache: true
      - name: Build, test and package
        shell: pwsh
        run: |
          $compiler = Join-Path (Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent) 'Tools/mingw1310_64'
          ./scripts/package.ps1 -QtRoot $env:QT_ROOT_DIR -CompilerRoot $compiler -IncludeSource
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DaySequence-windows-x64
          path: artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DaySequence-windows-x64
          path: artifacts
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -F "project(DaySequence VERSION $version " CMakeLists.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded files."
          else
            gh release create "$TAG" artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --title "日序 $TAG" --notes-file RELEASE_NOTES.md --draft
          fi
